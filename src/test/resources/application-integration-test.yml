spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # datasource 정보는 ApplicationContext 로드시 동적으로 주입
  data:
    redis:
      # redis 정보는 ApplicationContext 로드시 동적으로 주입
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  test:
    database:
      replace: none
  flyway:
    enabled: false # 테스트 환경에서는 flyway를 사용하지 않습니다.
  sql:
    init:
      mode: always
      schema-locations: classpath:/testdb/schema.sql # 운영 DB 수정 시 함께 수정 필요 합니다.
jwt:
  secret: eWpoLWNzdGFyLWJhY2tlbmQtand0LXNlY3JldC1rZXkteWpoLWNzdGFyLWJhY2tlbmQtand0LXNlY3JldC1rZXkK
  token-validity-in-seconds: 86400

cors:
    src: http://localhost:3000

game:
  play:
    threads:
      max: 300
      core: 200
